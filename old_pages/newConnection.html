<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <title>Cycling and Barbecues - New Connection</title>
        <link rel="stylesheet" href="newConnection.css">
        <link rel="stylesheet" href="header-footer.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css"> <!-- for social media links -->

    </head>

    <body>
        <header>
            <!--
                will need link to connections.html
                "start a new connection" links to newConnection.html
                "login" and "sign up" buttons that link to nothing
                image logo (or possibly text with bike and bbq emoji) links to index.html
             -->
             <div id="header">
                <div id="user-navigation">
                    <div id="logo">
                        <h1><a href="index.html"><span class="logo-emoji">&#128690;</span> Cycling and Barbecues <span class="logo-emoji">&#129385;</span></a></h1>
                    </div>
                    <ul id="user-navlist">
                        <li id="connections-nav">
                            <a href="connections.html">Connections</a>
                        </li>
                        <li id="new-connection-nav">
                            <a href="newConnection.html">Start a New Connection</a>
                        </li>
                        <li id="login">
                            <a href="">Login</a>
                        </li>
                        <li id="sign-up">
                            <a href="">Sign Up</a>
                        </li>
                    </ul>
                </div>
            </div>
        </header>

        <main>
            <!--
                need form to allow users to input the following:
                topic
                title
                host
                details
                location
                date
                time frame
                image URL
                "create connection button" that links to current page
            -->
            <form action="newConnection.html" method="get" name="new-connection" id="new-connection">
                <table id="form-formatting">
                    <tbody>
                        <tr>
                            <td><label for="topic">Topic</label></td>
                            <td><input type="text" name="topic" id="topic" placeholder="Cycling"></td>
                        </tr>
                        <tr>
                            <td><label for="title">Title</label></td>
                            <td><input type="text" name="title" id="title" placeholder="Critical Mass Charlotte"></td>
                        </tr>
                        <tr>
                            <td><label for="host">Host</label></td>
                            <td><input type="text" name="host" id="host" placeholder="Charlotte Urbanists and Fixed Federation"></td>
                        </tr>
                        <tr>
                            <td><label for="details">Details</label></td>
                            <td><textarea name="details" id="details"></textarea></td>
                        </tr>
                        <tr>
                            <td><label for="location">Location</label></td>
                            <td><input type="text" name="location" id="location" placeholder="1st Ward Park, Charlotte, NC"></td>
                        </tr>
                        <tr>
                            <td><label for="date">Date</label></td>
                            <td><input type="date" name="date" id="date"></td>
                        </tr>
                        <tr>
                            <td><label for="time-start">Start</label></td>
                            <td><input type="time" name="time-start" id="time-start"></td>
                        </tr>
                        <tr>
                            <td><label for="time-end">End</label></td>
                            <td><input type="time" name="time-end" id="time-end"></td>
                        </tr>
                        <tr>
                            <td><label for="image-url">Image URL</label></td>
                            <td><input type="text" name="image-url" id="image-url"></td>
                        </tr>
                        <tr>
                            <td colspan="2"><button type="button" id="submit" onclick="window.location.href='connections.html'">Create Connection</button></td>
                        </tr>
                    </tbody>
                </table>
            </form>
        </main>

        <footer>
            <!--
                copyright cycling and barbecues
                "about" button and "contact" button that link to nothing

                twitter and facebook buttons that link to nothing
            -->
            <div id="footer">
                <p>&copy; Cycling and Barbecues</p>
                <a href="">
                    <p>About</p>
                </a>
                <a href="">
                    <p>Contact</p>
                </a>

                <!-- social media -->
                <a href="#" class="fa fa-facebook"></a>
                <a href="#" class="fa fa-twitter"></a>
            </div>
        </footer>
    </body>
</html>
